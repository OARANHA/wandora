services:
  platform-admin:
    environment:
      WANDORA_PLATFORM_ADMIN_AUTH_ENABLED: "true"
      WANDORA_AUTH_JWKS_URL: https://supabase.wandora.com.br/auth/v1/.well-known/jwks.json
      WANDORA_AUTH_ISSUER: https://supabase.wandora.com.br/auth/v1
      WANDORA_AUTH_AUDIENCE: authenticated
      WANDORA_PLATFORM_OPERATOR_SUBJECTS_FILE: /run/secrets/platform_operator_subjects
    volumes:
      - ${WANDORA_PLATFORM_OPERATOR_SUBJECTS_FILE:?set WANDORA_PLATFORM_OPERATOR_SUBJECTS_FILE}:/run/secrets/platform_operator_subjects:ro
    networks:
      - wandora-platform-auth-egress

networks:
  wandora-platform-auth-egress:
    name: wandora-platform-auth-egress
