services:
  control-bridge:
    image: nginxinc/nginx-unprivileged:1.29.1-alpine
    container_name: wandora-control-bridge
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
      - /var/cache/nginx:rw,noexec,nosuid,size=8m
    volumes:
      - ./control-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8080"
    networks:
      - wandora-edge
      - wandora-core
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/__bridge_health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  runtime-console:
    build:
      context: ../../..
      dockerfile: integrations/mastra/operator-console-v1/Dockerfile
    image: wandora/mastra-operator-console:v1
    container_name: wandora-runtime-console
    restart: unless-stopped
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.mastra:rw,noexec,nosuid,size=64m
    environment:
      HOME: /tmp/home
      MASTRA_TELEMETRY_DISABLED: "true"
      DO_NOT_TRACK: "1"
    expose:
      - "4111"
    networks:
      - wandora-edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4111/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  wandora-edge:
    external: true
  wandora-core:
    external: true
