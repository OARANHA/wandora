services:
  api-gw:
    networks:
      default:
        aliases:
          - envoy
          - kong
      wandora-edge: {}

  db:
    networks:
      default: {}
      wandora-data:
        aliases:
          - wandora-postgres

  auth:
    user: "0"
    environment:
      GOTRUE_JWT_KEYS: ${JWT_KEYS:-[]}
      GOTRUE_SMTP_PASS: !reset null
    command:
      - /bin/sh
      - -ec
      - |
        GOTRUE_SMTP_PASS="$$(cat /run/secrets/gotrue_smtp_pass)"
        export GOTRUE_SMTP_PASS
        exec /bin/su -p -s /bin/sh supabase -c 'exec /usr/local/bin/auth'
    secrets:
      - source: gotrue_smtp_pass
        target: gotrue_smtp_pass

  realtime:
    environment:
      API_JWT_JWKS: ${JWT_JWKS:-{"keys":[]}}
  storage:
    environment:
      JWT_JWKS: ${JWT_JWKS:-{"keys":[]}}
  functions:
    environment:
      SUPABASE_JWKS: ${JWT_JWKS:-{"keys":[]}}
  supavisor:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT}:5432"
      - "127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION}:6543"

networks:
  wandora-edge:
    external: true
  wandora-data:
    external: true

secrets:
  gotrue_smtp_pass:
    file: /opt/wandora/data/supabase/secrets/gotrue_smtp_pass
