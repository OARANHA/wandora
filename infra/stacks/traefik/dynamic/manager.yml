http:
  routers:
    wandora-evolution-manager:
      rule: "Host(`manager.wandora.com.br`)"
      entryPoints:
        - websecure
      service: wandora-evolution-manager
      middlewares:
        - wandora-manager-origin
        - wandora-manager-security
        - wandora-manager-rate-limit
      tls:
        certResolver: letsencrypt

  middlewares:
    wandora-manager-origin:
      headers:
        customRequestHeaders:
          Origin: "https://manager.wandora.com.br"
    wandora-manager-security:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: "no-referrer"
        stsSeconds: 31536000
        stsIncludeSubdomains: true
    wandora-manager-rate-limit:
      rateLimit:
        average: 20
        burst: 40

  services:
    wandora-evolution-manager:
      loadBalancer:
        servers:
          - url: "http://wandora-evolution:8080"
