<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Wandora — Status</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b0d10;color:#eef2f6;margin:0;min-height:100vh;display:grid;place-items:center}
    main{width:min(680px,88vw);padding:42px;border:1px solid #252a31;border-radius:18px;background:#11151a}
    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#37d67a;margin-right:10px;box-shadow:0 0 18px #37d67a55}
    h1{margin:0 0 14px;font-size:2rem} p{color:#aeb7c2;line-height:1.6} strong{color:#eef2f6}
    footer{margin-top:28px;font-size:.9rem;color:#788390}
  </style>
</head>
<body>
<main>
  <h1>Wandora</h1>
  <p><span class="dot"></span><strong>Infraestrutura operacional</strong></p>
  <p>Os serviços de borda estão respondendo normalmente.</p>
  <footer>status.wandora.com.br</footer>
</main>
</body>
</html>
