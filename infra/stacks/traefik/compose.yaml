services:
  traefik:
    image: traefik:v3.7.13
    container_name: wandora-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.admin.address=:8080
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --ping=true
      - --ping.entrypoint=admin
      - --log.level=INFO
      - --accesslog=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL is required}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.caserver=https://acme-v02.api.letsencrypt.org/directory
    environment:
      CF_DNS_API_TOKEN_FILE: /run/secrets/cloudflare_dns_api_token
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./dynamic:/etc/traefik/dynamic:ro
      - /opt/wandora/data/traefik/acme.json:/letsencrypt/acme.json
    secrets:
      - cloudflare_dns_api_token
    networks:
      - wandora-edge
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  wandora-edge:
    external: true

secrets:
  cloudflare_dns_api_token:
    file: /opt/wandora/data/traefik/secrets/cloudflare_dns_api_token
