services:
  web:
    image: ${WANDORA_WEB_IMAGE:-wandora/web:preview-v1}
    container_name: wandora-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - wandora-edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  wandora-edge:
    external: true
