server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /api/v1/me {
    proxy_pass http://wandora-core:8788;
    proxy_http_version 1.1;
    proxy_set_header Host wandora-core;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
  }

  location = /api/v1/onboarding/company {
    proxy_pass http://wandora-core:8788;
    proxy_http_version 1.1;
    proxy_set_header Host wandora-core;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Idempotency-Key $http_idempotency_key;
    proxy_set_header Cookie "";
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
  }

  location ~ "^/api/v1/onboarding/lookup/(cep|cnpj)/[0-9A-Za-z]+$" {
    proxy_pass http://wandora-core:8788;
    proxy_http_version 1.1;
    proxy_set_header Host wandora-core;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
  }

  location ~ "^/api/v1/organizations/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}/profile$" {
    proxy_pass http://wandora-core:8788;
    proxy_http_version 1.1;
    proxy_set_header Host wandora-core;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Idempotency-Key $http_idempotency_key;
    proxy_set_header Cookie "";
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
  }

  location ~ "^/api/v1/organizations/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}/work/attention-required$" {
    proxy_pass http://wandora-core:8788;
    proxy_http_version 1.1;
    proxy_set_header Host wandora-core;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_set_header Connection "";
