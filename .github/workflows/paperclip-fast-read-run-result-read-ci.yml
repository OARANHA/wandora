name: Paperclip Fast Read Run Result Read CI

on:
  pull_request:
    paths:
      - 'integrations/paperclip/fast-read-run-result-read-v1/**'
      - 'integrations/paperclip/patches/v2026.916.1-fast-read-run-result-read-v1.patch'
      - '.github/workflows/paperclip-fast-read-run-result-read-ci.yml'
      - 'docs/decisions/0284-paperclip-fast-read-terminal-result-read-boundary-preflight-v1.md'
      - 'docs/CAPABILITY_AUTHORITY.md'
      - 'docs/architecture.md'
      - 'docs/CANONICAL_STATE.md'
      - 'docs/WANDORA_PROJECT_SOURCE.md'
  push:
    branches: [main]
    paths:
      - 'integrations/paperclip/fast-read-run-result-read-v1/**'
      - 'integrations/paperclip/patches/v2026.916.1-fast-read-run-result-read-v1.patch'
      - '.github/workflows/paperclip-fast-read-run-result-read-ci.yml'
      - 'docs/decisions/0284-paperclip-fast-read-terminal-result-read-boundary-preflight-v1.md'
      - 'docs/CAPABILITY_AUTHORITY.md'
      - 'docs/architecture.md'
      - 'docs/CANONICAL_STATE.md'
      - 'docs/WANDORA_PROJECT_SOURCE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paperclip-fast-read-run-result-read-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout Wandora
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact Paperclip v2026.916.1 source
        uses: actions/checkout@v4
        with:
          repository: paperclipai/paperclip
          ref: d554c4789ed3930f8a53ac9fdf6503b3187097da
          path: .paperclip
          persist-credentials: false

      - name: Apply retained Fast Read run-result read patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .paperclip rev-parse HEAD)" = "d554c4789ed3930f8a53ac9fdf6503b3187097da"
          patch_file="$GITHUB_WORKSPACE/integrations/paperclip/patches/v2026.916.1-fast-read-run-result-read-v1.patch"
          test "$(sha256sum "$patch_file" | awk '{print $1}')" = "34df4f673f824ebbc9025745b016672d2832b82131f85b1906d02528e5764338"
          echo "=== exact types.ts anchors ==="
          grep -n -B 4 -A 8 "export interface PluginIssuesClient" .paperclip/packages/plugins/sdk/src/types.ts || true
          grep -n -B 8 -A 8 "summaries: PluginIssueSummariesClient" .paperclip/packages/plugins/sdk/src/types.ts || true
          grep -n -B 8 -A 14 "export interface PluginContext" .paperclip/packages/plugins/sdk/src/types.ts || true
          grep -n -B 6 -A 10 "approvals: PluginApprovalsClient" .paperclip/packages/plugins/sdk/src/types.ts || true
          git -C .paperclip apply --check "$patch_file"
          git -C .paperclip apply "$patch_file"
          git -C .paperclip diff --check

      - name: Set up Node 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Static authority and leak verifier
        run: node integrations/paperclip/fast-read-run-result-read-v1/verify.mjs .paperclip

      - name: Set up pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version

      - name: Install pinned Paperclip dependencies
        working-directory: .paperclip
        run: pnpm install --frozen-lockfile

      - name: Typecheck patched plugin SDK
        working-directory: .paperclip
        run: pnpm --filter @paperclipai/plugin-sdk typecheck

      - name: Typecheck patched Paperclip server
        working-directory: .paperclip
        run: pnpm --filter @paperclipai/server typecheck

      - name: Focused capability and tenant/run-boundary tests
        working-directory: .paperclip
        run: |
          pnpm exec vitest run \
            packages/plugins/sdk/tests/host-client-factory.test.ts \
            server/src/__tests__/plugin-agent-run-read.test.ts
