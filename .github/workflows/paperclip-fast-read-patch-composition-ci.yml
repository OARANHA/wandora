name: Paperclip Fast Read Patch Composition CI

on:
  pull_request:
    paths:
      - 'integrations/paperclip/patches/v2026.916.1-host-operational-read-v1.patch'
      - 'integrations/paperclip/patches/v2026.916.1-fast-read-run-result-read-v1.patch'
      - 'integrations/paperclip/patches/v2026.916.1-synchronous-webhook-response-v1.patch'
      - '.github/workflows/paperclip-fast-read-patch-composition-ci.yml'
      - 'integrations/paperclip/plugins/organization-adapter-v1/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paperclip-fast-read-patch-composition-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Wandora
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact Paperclip v2026.916.1 source
        uses: actions/checkout@v4
        with:
          repository: paperclipai/paperclip
          ref: d554c4789ed3930f8a53ac9fdf6503b3187097da
          path: .paperclip
          persist-credentials: false

      - name: Compose qualified provider deltas
        shell: bash
        run: |
          set -euo pipefail
          upstream="d554c4789ed3930f8a53ac9fdf6503b3187097da"
          test "$(git -C .paperclip rev-parse HEAD)" = "$upstream"

          cp -a .paperclip .paperclip-run-result
          run_patch="$GITHUB_WORKSPACE/integrations/paperclip/patches/v2026.916.1-fast-read-run-result-read-v1.patch"
          git -C .paperclip-run-result apply --check "$run_patch"
          git -C .paperclip-run-result apply "$run_patch"
          git -C .paperclip-run-result diff --full-index --binary > "$RUNNER_TEMP/run-result-full-index.patch"
          test -s "$RUNNER_TEMP/run-result-full-index.patch"

          operational_patch="$GITHUB_WORKSPACE/integrations/paperclip/patches/v2026.916.1-host-operational-read-v1.patch"
          git -C .paperclip apply --check "$operational_patch"
          git -C .paperclip apply "$operational_patch"
          git -C .paperclip add -A

          set +e
          git -C .paperclip apply --3way "$RUNNER_TEMP/run-result-full-index.patch"
          compose_rc=$?
          set -e
          if [[ "$compose_rc" -ne 0 ]]; then
            echo "=== FAST READ COMPOSITION CONFLICTS ==="
            git -C .paperclip status --short
            while IFS= read -r conflicted; do
              [[ -n "$conflicted" ]] || continue
              echo "=== CONFLICT FILE: $conflicted ==="
              grep -n -B 12 -A 80 '<<<<<<<' ".paperclip/$conflicted" || true
            done < <(git -C .paperclip diff --name-only --diff-filter=U)
            exit "$compose_rc"
          fi

          webhook_patch="$GITHUB_WORKSPACE/integrations/paperclip/patches/v2026.916.1-synchronous-webhook-response-v1.patch"
          git -C .paperclip apply --check "$webhook_patch"
          git -C .paperclip apply "$webhook_patch"

          git -C .paperclip diff --check
          git -C .paperclip diff --cached --check
          test -z "$(git -C .paperclip ls-files -u)"
          grep -q '"tools.operational.read"' .paperclip/packages/shared/src/constants.ts
          grep -q '"agent.runs.read"' .paperclip/packages/shared/src/constants.ts
          grep -q 'PLUGIN_WEBHOOK_RESPONSE_MAX_BYTES' .paperclip/packages/plugins/sdk/src/define-plugin.ts
          echo "PAPERCLIP_FAST_READ_PATCH_COMPOSITION_V1_OK"
