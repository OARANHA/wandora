name: Organization Adapter Plugin CI

on:
  pull_request:
    paths:
      - 'integrations/paperclip/plugins/organization-adapter-v1/**'
      - '.github/workflows/organization-adapter-plugin-ci.yml'
      - 'docs/decisions/0050-organization-adapter-managed-plugin-production-artifact-v1.md'
      - 'docs/CANONICAL_STATE.md'
  push:
    branches: [main]
    paths:
      - 'integrations/paperclip/plugins/organization-adapter-v1/**'
      - '.github/workflows/organization-adapter-plugin-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: organization-adapter-plugin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Wandora
        uses: actions/checkout@v4

      - name: Checkout pinned Paperclip source
        uses: actions/checkout@v4
        with:
          repository: paperclipai/paperclip
          ref: d554c4789ed3930f8a53ac9fdf6503b3187097da
          path: .paperclip

      - name: Compose qualified Paperclip Fast Read provider deltas
        shell: bash
        run: |
          set -euo pipefail
          chmod +x integrations/paperclip/fast-read-convergence-v1/compose-qualified-patches.sh
          integrations/paperclip/fast-read-convergence-v1/compose-qualified-patches.sh "$GITHUB_WORKSPACE/.paperclip"

      - name: Set up Node 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Set up pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version

      - name: Install pinned Paperclip dependencies
        working-directory: .paperclip
        run: pnpm install --frozen-lockfile

      - name: Build pinned Paperclip plugin SDK
        working-directory: .paperclip
        run: pnpm --filter @paperclipai/plugin-sdk build

      - name: Typecheck, test, validate and package
        env:
          WANDORA_SOURCE_SHA: ${{ github.sha }}
        run: |
          chmod +x integrations/paperclip/plugins/organization-adapter-v1/scripts/verify-package.sh
          integrations/paperclip/plugins/organization-adapter-v1/scripts/verify-package.sh "$GITHUB_WORKSPACE/.paperclip"

      - name: Upload private installable artifact
        uses: actions/upload-artifact@v4
        with:
          name: organization-adapter-plugin-${{ github.sha }}
          path: integrations/paperclip/plugins/organization-adapter-v1/artifacts/*
          if-no-files-found: error
          retention-days: 7
