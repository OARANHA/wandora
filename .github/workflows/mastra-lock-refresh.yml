name: Mastra Lock Refresh

on:
  push:
    branches:
      - feat/core-mastra-deterministic-proposal-v1
    paths:
      - apps/core/package.json
      - .github/workflows/mastra-lock-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/core-mastra-deterministic-proposal-v1
          fetch-depth: 0

      - name: Setup pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: apps/core/package-lock.json

      - name: Regenerate Core lockfile
        working-directory: apps/core
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- apps/core/package-lock.json; then
            echo "package-lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/core/package-lock.json
          git commit -m "build: refresh Core lock for deterministic Mastra"
          git push origin HEAD:feat/core-mastra-deterministic-proposal-v1
