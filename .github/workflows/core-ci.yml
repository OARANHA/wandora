name: Core CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ana-core-verifier:
    name: Ana Core verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve container secret GID
        shell: bash
        run: echo "WANDORA_CI_CONTAINER_SECRET_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Run reproducible Ana Core verifier
        shell: bash
        run: bash apps/core/scripts/verify-ana-v1.sh

      - name: Run Private Tenant Provisioning V2 verifier
        shell: bash
        run: bash apps/core/scripts/verify-private-tenant-provisioning-v2.sh

      - name: Run Customer Hire Tenant Eligibility V1 verifier
        shell: bash
        run: bash apps/core/scripts/verify-customer-hire-tenant-eligibility-v1.sh

      - name: Run Organization Grounding Contract V1 verifier
        shell: bash
        run: bash apps/core/scripts/verify-organization-grounding-v1.sh

      - name: Run Digital Employee Development V1 verifier
        shell: bash
        run: bash apps/core/scripts/verify-digital-employee-development-v1.sh

      - name: Run Organization Adapter Production Activation Rehearsal verifier
        shell: bash
        run: bash apps/core/scripts/verify-organization-adapter-production-activation-rehearsal-v1.sh

      - name: Validate deterministic Agent Runtime + Human API + Organization Adapter overlays
        shell: bash
        env:
          WANDORA_CORE_DB_PASSWORD_FILE: /tmp/ci-core-db-secret
          WANDORA_CORE_SECRET_GID: "1000"
          WANDORA_GATEWAY_CORE_INGRESS_SECRET_FILE: /tmp/ci-gateway-core-secret
          WANDORA_CORE_GATEWAY_OUTBOUND_SECRET_FILE: /tmp/ci-core-outbound-secret
          WANDORA_HUMAN_SEND_PROPOSAL_CONNECTION_ID: 22222222-2222-2222-2222-222222222222
          WANDORA_ORGANIZATION_ADAPTER_SECRET_DIR_HOST: /tmp/ci-organization-adapter-secrets
          WANDORA_PAPERCLIP_EXECUTION_BRIDGE_SECRET_FILE_HOST: /tmp/ci-paperclip-execution-bridge-secret
          WANDORA_MODEL_API_KEY_FILE_HOST: ${{ runner.temp }}/model-provider.synthetic
        run: |
          effective="$(docker compose \
            -f infra/stacks/core/compose.yaml \
            -f infra/stacks/core/compose.database.yaml \
            -f infra/stacks/core/compose.gateway-ingress.yaml \
            -f infra/stacks/core/compose.agent-runtime-deterministic.yaml \
            -f infra/stacks/core/compose.human-api.yaml \
            -f infra/stacks/core/compose.customer-company-onboarding.yaml \
            -f infra/stacks/core/compose.human-send-proposal.yaml \
            -f infra/stacks/core/compose.organization-adapter.yaml \
            -f infra/stacks/core/compose.paperclip-execution-bridge.yaml \
            -f infra/stacks/core/compose.human-digital-employee-activation.yaml \
            -f infra/stacks/core/compose.human-digital-employee-work.yaml \
            config)"
          printf '%s\n' "$effective" >/dev/null
          grep -q 'WANDORA_HUMAN_API_ENABLED: "true"' <<<"$effective"
          grep -q 'WANDORA_AUTH_JWKS_URL: https://supabase.wandora.com.br/auth/v1/.well-known/jwks.json' <<<"$effective"
          grep -q 'WANDORA_AUTH_ISSUER: https://supabase.wandora.com.br/auth/v1' <<<"$effective"
          grep -q 'WANDORA_AUTH_AUDIENCE: authenticated' <<<"$effective"
          grep -q 'WANDORA_CUSTOMER_COMPANY_ONBOARDING_ENABLED: "true"' <<<"$effective"
          grep -q 'WANDORA_HUMAN_SEND_PROPOSAL_ENABLED: "true"' <<<"$effective"
          grep -q 'WANDORA_HUMAN_SEND_PROPOSAL_CONNECTION_ID: 22222222-2222-2222-2222-222222222222' <<<"$effective"
          grep -q 'WANDORA_MESSAGING_GATEWAY_OUTBOUND_URL: http://wandora-messaging-gateway:8787/internal/v1/core/outbound/text' <<<"$effective"
          grep -q 'WANDORA_CORE_OUTBOUND_SECRET_FILE: /run/secrets/core_outbound_hmac' <<<"$effective"
          grep -q 'WANDORA_ORGANIZATION_ADAPTER_ENABLED: "true"' <<<"$effective"
          grep -q 'WANDORA_ORGANIZATION_ADAPTER_WEBHOOK_URL: http://wandora-paperclip:3100/api/plugins/wandora.organization-adapter-v1/webhooks/employee-reconcile' <<<"$effective"
          grep -q 'WANDORA_ORGANIZATION_ADAPTER_SECRET_DIRECTORY: /run/secrets/wandora/organization-adapter' <<<"$effective"
          grep -q 'source: /tmp/ci-organization-adapter-secrets' <<<"$effective"
          grep -q 'target: /run/secrets/wandora/organization-adapter' <<<"$effective"
          grep -q 'WANDORA_HUMAN_DIGITAL_EMPLOYEE_ACTIVATION_ENABLED: "true"' <<<"$effective"
          grep -q 'WANDORA_ORGANIZATION_ADAPTER_ACTIVATION_WEBHOOK_URL: http://wandora-paperclip:3100/api/plugins/wandora.organization-adapter-v1/webhooks/employee-activate' <<<"$effective"
          grep -q 'WANDORA_HUMAN_DIGITAL_EMPLOYEE_WORK_ENABLED: "true"' <<<"$effective"
          grep -q 'WANDORA_ORGANIZATION_ADAPTER_WORK_WEBHOOK_URL: http://wandora-paperclip:3100/api/plugins/wandora.organization-adapter-v1/webhooks/employee-work' <<<"$effective"
          grep -q 'WANDORA_PAPERCLIP_EXECUTION_BRIDGE_ENABLED: "true"' <<<"$effective"
          grep -q 'WANDORA_PAPERCLIP_AGENT_ME_URL: http://wandora-paperclip:3100/api/agents/me' <<<"$effective"
          grep -q 'WANDORA_PAPERCLIP_EXECUTION_BRIDGE_SECRET_FILE: /run/secrets/wandora/paperclip-execution-bridge.hmac' <<<"$effective"
          grep -q 'source: /tmp/ci-paperclip-execution-bridge-secret' <<<"$effective"
          grep -q 'target: /run/secrets/wandora/paperclip-execution-bridge.hmac' <<<"$effective"
          grep -q 'read_only: true' <<<"$effective"
          ! grep -q 'WANDORA_HUMAN_AUTH_' <<<"$effective"

          printf '%s\n' 'synthetic-mistral-api-key-0123456789abcdef' > "$WANDORA_MODEL_API_KEY_FILE_HOST"
          chmod 0640 "$WANDORA_MODEL_API_KEY_FILE_HOST"
          model_effective="$(docker compose \
            -f infra/stacks/core/compose.yaml \
            -f infra/stacks/core/compose.database.yaml \
            -f infra/stacks/core/compose.gateway-ingress.yaml \
            -f infra/stacks/core/compose.agent-runtime-model.yaml \
            -f infra/stacks/core/compose.human-api.yaml \
            -f infra/stacks/core/compose.organization-adapter.yaml \
            -f infra/stacks/core/compose.paperclip-execution-bridge.yaml \
            -f infra/stacks/core/compose.human-digital-employee-activation.yaml \
            -f infra/stacks/core/compose.human-digital-employee-work.yaml \
            config)"
          grep -q 'WANDORA_AGENT_RUNTIME_MODE: mastra-supervised-model' <<<"$model_effective"
          grep -q 'WANDORA_MODEL_PROVIDER: mistral' <<<"$model_effective"
          grep -q 'WANDORA_MODEL_ID: mistral-small-2603' <<<"$model_effective"
          grep -q 'WANDORA_MODEL_BASE_URL: https://api.mistral.ai/v1' <<<"$model_effective"
          grep -q 'WANDORA_MODEL_API_KEY_FILE: /run/secrets/wandora/model-provider.api-key' <<<"$model_effective"
          grep -q 'WANDORA_MODEL_MAX_OUTPUT_TOKENS: "768"' <<<"$model_effective"
          grep -q 'WANDORA_MODEL_REQUEST_TIMEOUT_MS: "45000"' <<<"$model_effective"
          grep -Fq "source: $WANDORA_MODEL_API_KEY_FILE_HOST" <<<"$model_effective"
          grep -q 'target: /run/secrets/wandora/model-provider.api-key' <<<"$model_effective"
          grep -q 'WANDORA_HUMAN_DIGITAL_EMPLOYEE_WORK_ENABLED: "true"' <<<"$model_effective"
          ! grep -q 'WANDORA_HUMAN_SEND_PROPOSAL_ENABLED' <<<"$model_effective"
          ! grep -q 'WANDORA_CORE_OUTBOUND_SECRET_FILE' <<<"$model_effective"
          rm -f "$WANDORA_MODEL_API_KEY_FILE_HOST"


      - name: Validate Semantic Fast Read production convergence overlays
        shell: bash
        env:
          WANDORA_TYPESAFE_JEV_API_KEY_FILE_HOST: ${{ runner.temp }}/typesafe-jev.synthetic
          WANDORA_FAST_READ_INTENT_SECRET_FILE_HOST: ${{ runner.temp }}/fast-read-intent.synthetic
        run: |
          set -euo pipefail

          # Gates-OFF compatibility convergence must render without requiring
          # either future host secret file.
          off_effective="$(env             -u WANDORA_TYPESAFE_JEV_API_KEY_FILE_HOST             -u WANDORA_FAST_READ_INTENT_SECRET_FILE_HOST             docker compose               -f infra/stacks/core/compose.yaml               -f infra/stacks/core/compose.semantic-fast-read.yaml               config)"

          grep -q 'WANDORA_FAST_READ_EXECUTION_ENABLED: "false"' <<<"$off_effective"
          grep -q 'WANDORA_SEMANTIC_FAST_READ_ENABLED: "false"' <<<"$off_effective"
          grep -q 'WANDORA_SEMANTIC_SELECTOR_ENABLED: "false"' <<<"$off_effective"
          grep -q 'WANDORA_HUMAN_SEND_PROPOSAL_ENABLED: "false"' <<<"$off_effective"
          grep -q 'WANDORA_FAST_READ_INTENT_SECRET_FILE: /run/secrets/wandora/fast-read-intent.hmac' <<<"$off_effective"
          grep -q 'WANDORA_TYPESAFE_JEV_API_KEY_FILE: /run/secrets/wandora/typesafe-jev.api-key' <<<"$off_effective"
          grep -q 'WANDORA_TYPESAFE_JEV_TIMEOUT_MS: "3000"' <<<"$off_effective"
          grep -q 'WANDORA_SEMANTIC_SELECTOR_TIMEOUT_MS: "3000"' <<<"$off_effective"
          ! grep -Fq "$WANDORA_TYPESAFE_JEV_API_KEY_FILE_HOST" <<<"$off_effective"
          ! grep -Fq "$WANDORA_FAST_READ_INTENT_SECRET_FILE_HOST" <<<"$off_effective"

          # Custody is a distinct future overlay. It introduces only the two
          # read-only mounts and never duplicates the existing Mistral mount.
          custody_effective="$(docker compose             -f infra/stacks/core/compose.yaml             -f infra/stacks/core/compose.semantic-fast-read.yaml             -f infra/stacks/core/compose.semantic-fast-read-custody.yaml             config)"

          grep -Fq "source: $WANDORA_TYPESAFE_JEV_API_KEY_FILE_HOST" <<<"$custody_effective"
          grep -q 'target: /run/secrets/wandora/typesafe-jev.api-key' <<<"$custody_effective"
          grep -Fq "source: $WANDORA_FAST_READ_INTENT_SECRET_FILE_HOST" <<<"$custody_effective"
          grep -q 'target: /run/secrets/wandora/fast-read-intent.hmac' <<<"$custody_effective"
          test "$(grep -c 'read_only: true' <<<"$custody_effective")" -ge 2
          ! grep -Fq 'model-provider.api-key' infra/stacks/core/compose.semantic-fast-read.yaml
          ! grep -Fq 'model-provider.api-key' infra/stacks/core/compose.semantic-fast-read-custody.yaml
          grep -Fq 'WANDORA_MODEL_API_KEY_FILE: /run/secrets/wandora/model-provider.api-key'             infra/stacks/core/compose.agent-runtime-model.yaml

          echo 'SEMANTIC_FAST_READ_PRODUCTION_ACTIVATION_CONTRACT_V1_OK'
