name: Messaging Gateway CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: messaging-gateway-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  messaging-gateway-verifier:
    name: Messaging Gateway verifier
    runs-on: [self-hosted, linux, x64, wandora-ci]
    timeout-minutes: 15
    env:
      WANDORA_CI_CONTAINER_SECRET_GID: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run code and image verifier
        shell: bash
        run: bash apps/messaging-gateway/scripts/verify-v1.sh

      - name: Validate private Compose contracts
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '%s\n' 'synthetic-evolution-jwt-secret-01234567890123456789' > "$tmp/evolution-jwt"
          printf '%s\n' 'synthetic-gateway-core-secret-012345678901234567890' > "$tmp/core-hmac"
          printf '%s\n' 'synthetic-core-outbound-secret-01234567890123456789' > "$tmp/core-outbound-hmac"
          printf '%s\n' 'synthetic-evolution-api-key-012345678901234567890' > "$tmp/evolution-api-key"
          printf '%s\n' 'synthetic-core-db-secret-012345678901234567890123' > "$tmp/core-db"
          WANDORA_GATEWAY_SECRET_GID="$WANDORA_CI_CONTAINER_SECRET_GID" \
          WANDORA_EVOLUTION_INSTANCE=wandora-ci-01 \
          WANDORA_ORGANIZATION_ID=11111111-1111-1111-1111-111111111111 \
          WANDORA_CONNECTION_ID=22222222-2222-2222-2222-222222222222 \
          WANDORA_EVOLUTION_WEBHOOK_JWT_KEY_FILE="$tmp/evolution-jwt" \
          WANDORA_GATEWAY_CORE_INGRESS_SECRET_FILE="$tmp/core-hmac" \
          docker compose -f infra/stacks/messaging-gateway/compose.yaml config >/dev/null
          WANDORA_GATEWAY_SECRET_GID="$WANDORA_CI_CONTAINER_SECRET_GID" \
          WANDORA_EVOLUTION_INSTANCE=wandora-ci-01 \
          WANDORA_ORGANIZATION_ID=11111111-1111-1111-1111-111111111111 \
          WANDORA_CONNECTION_ID=22222222-2222-2222-2222-222222222222 \
          WANDORA_EVOLUTION_WEBHOOK_JWT_KEY_FILE="$tmp/evolution-jwt" \
          WANDORA_GATEWAY_CORE_INGRESS_SECRET_FILE="$tmp/core-hmac" \
          WANDORA_CORE_GATEWAY_OUTBOUND_SECRET_FILE="$tmp/core-outbound-hmac" \
          WANDORA_EVOLUTION_API_KEY_FILE="$tmp/evolution-api-key" \
          docker compose \
            -f infra/stacks/messaging-gateway/compose.yaml \
            -f infra/stacks/messaging-gateway/compose.outbound-evolution.yaml \
            config >/dev/null
          WANDORA_CORE_SECRET_GID="$WANDORA_CI_CONTAINER_SECRET_GID" \
          WANDORA_CORE_DB_PASSWORD_FILE="$tmp/core-db" \
          WANDORA_GATEWAY_CORE_INGRESS_SECRET_FILE="$tmp/core-hmac" \
          docker compose \
            -f infra/stacks/core/compose.yaml \
            -f infra/stacks/core/compose.database.yaml \
            -f infra/stacks/core/compose.gateway-ingress.yaml \
            config >/dev/null

      - name: Smoke hardened private runtime
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          network="wandora-gateway-ci-${GITHUB_RUN_ID}"
          container="wandora-gateway-ci-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
            rm -rf "$tmp"
          }
          trap cleanup EXIT
          printf '%s\n' 'synthetic-evolution-jwt-secret-01234567890123456789' > "$tmp/evolution-jwt"
          printf '%s\n' 'synthetic-gateway-core-secret-012345678901234567890' > "$tmp/core-hmac"
          chmod 0640 "$tmp/evolution-jwt" "$tmp/core-hmac"
          docker network create "$network" >/dev/null
          docker run -d \
            --name "$container" \
            --network "$network" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --group-add "$WANDORA_CI_CONTAINER_SECRET_GID" \
            -e PORT=8787 \
            -e WANDORA_EVOLUTION_INSTANCE=wandora-ci-01 \
            -e WANDORA_ORGANIZATION_ID=11111111-1111-1111-1111-111111111111 \
            -e WANDORA_CONNECTION_ID=22222222-2222-2222-2222-222222222222 \
            -e WANDORA_EVOLUTION_WEBHOOK_JWT_KEY_FILE=/run/secrets/evolution-jwt \
            -e WANDORA_CORE_INGRESS_SECRET_FILE=/run/secrets/core-hmac \
            -v "$tmp/evolution-jwt:/run/secrets/evolution-jwt:ro" \
            -v "$tmp/core-hmac:/run/secrets/core-hmac:ro" \
            wandora/messaging-gateway:verify >/dev/null
          ready=0
          for _ in $(seq 1 20); do
            if docker run --rm --network "$network" \
              node:22.23.2-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5 \
              node -e "fetch('http://${container}:8787/healthz').then(async r=>{if(!r.ok)process.exit(1);const body=await r.json();if(body.service!=='wandora-messaging-gateway')process.exit(1)}).catch(()=>process.exit(1))"; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          docker run --rm --network "$network" \
            node:22.23.2-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5 \
            node -e "fetch('http://${container}:8787/internal/v1/core/outbound/text',{method:'POST'}).then(r=>{if(r.status!==404)process.exit(1)}).catch(()=>process.exit(1))"
          test "$(docker inspect -f '{{.Config.User}}' "$container")" = node
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$container")" = true
          test -z "$(docker port "$container")"
          echo 'WANDORA_MESSAGING_GATEWAY_RUNTIME_V1_OK'
