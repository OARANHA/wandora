name: Paperclip ADR0295 Frozen Candidate Release Publication

on:
  push:
    branches:
      - feat/semantic-fast-read-runtime-wiring-v1
    paths:
      - '.github/workflows/paperclip-adr0295-frozen-candidate-release.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: paperclip-adr0295-frozen-candidate-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ARTIFACT_ID: '10914008713'
      ARTIFACT_ZIP_SHA256: 'e43acc85e3f7f010b7189f11bd9c3622f9a7a9015765a50f315ca61a98c36a19'
      CANDIDATE_FILE: 'paperclip-v2026.916.1-fast-read-candidate.tar.zst'
      CANDIDATE_SHA256: '69c962c79375446060af12fc9240385987790f4d11a3528cbb7a6ad745e98269'
      RAW_ARCHIVE_SHA256: 'a91f96feff4dbb8161d182e350fc3e2ca1d0d6784cfa9179fdaa20a200e7ce97'
      PROVENANCE_SHA256: '00dc1f18c30e610107498531c80a09d9296b5295008a72c8ab2208a212af01e9'
      DOCKER_CONFIG_DIGEST: 'sha256:e05f1604cf863d316b4ce5db189782f022fa4fd17544f9724747e11223d4356c'
      PAPERCLIP_SOURCE_SHA: 'd554c4789ed3930f8a53ac9fdf6503b3187097da'
      CANDIDATE_SOURCE_HEAD: '2029c7b3f49ad984510f30c4e19cff3e52c877ff'
      TESTED_MERGE_REF: 'fd4d9373d3d7e4d9eca202abdf075fde8feeb8d0'
      RELEASE_TAG: 'paperclip-fast-read-adr0295-artifact-10914008713'
    steps:
      - name: Download exact frozen Actions artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/adr0295-frozen-candidate"
          mkdir -p "$work/files"
          printf '%s\n' "$work" > "$RUNNER_TEMP/adr0295-workdir"

          curl --fail --location --silent --show-error --retry 0 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$work/artifact.zip" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"

          actual_zip_sha="$(sha256sum "$work/artifact.zip" | awk '{print $1}')"
          test "$actual_zip_sha" = "$ARTIFACT_ZIP_SHA256"
          echo 'ADR0295_ACTIONS_ARTIFACT_ZIP_DIGEST_OK'

      - name: Verify exact frozen candidate contents
        shell: bash
        run: |
          set -euo pipefail
          work="$(cat "$RUNNER_TEMP/adr0295-workdir")"
          unzip -q "$work/artifact.zip" -d "$work/files"

          expected_files="$(printf '%s\n' \
            'SHA256SUMS' \
            'paperclip-v2026.916.1-fast-read-candidate.tar.zst' \
            'provenance.json' | sort)"
          actual_files="$(find "$work/files" -maxdepth 1 -type f -printf '%f\n' | sort)"
          test "$actual_files" = "$expected_files"

          (
            cd "$work/files"
            sha256sum -c SHA256SUMS
          )

          test "$(sha256sum "$work/files/$CANDIDATE_FILE" | awk '{print $1}')" = "$CANDIDATE_SHA256"
          test "$(sha256sum "$work/files/provenance.json" | awk '{print $1}')" = "$PROVENANCE_SHA256"

          PROVENANCE="$work/files/provenance.json" node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync(process.env.PROVENANCE, 'utf8'));
          const must = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          must(p.contract === 'paperclip-fast-read-production-candidate-v1', 'candidate contract mismatch');
          must(p.artifactFormat === 'docker-archive+zstd', 'artifact format mismatch');
          must(p.imageTag === 'wandora/paperclip:v2026.916.1', 'image tag mismatch');
          must(p.dockerConfigDigest === process.env.DOCKER_CONFIG_DIGEST, 'docker config digest mismatch');
          must(p.paperclipSourceCommit === process.env.PAPERCLIP_SOURCE_SHA, 'Paperclip source mismatch');
          must(p.wandoraSourceSha === process.env.TESTED_MERGE_REF, 'tested merge ref mismatch');
          must(p.dockerArchiveSha256 === process.env.RAW_ARCHIVE_SHA256, 'raw archive digest mismatch');
          must(p.compressedArtifactSha256 === process.env.CANDIDATE_SHA256, 'compressed digest mismatch');
          must(p.startup?.result === 'ok', 'startup proof missing');
          must(p.startup?.deploymentMode === 'authenticated', 'startup mode mismatch');
          must(p.startup?.deploymentExposure === 'private', 'startup exposure mismatch');
          must(Array.isArray(p.patches) && p.patches.length === 3, 'qualified patch set mismatch');
          NODE

          zstd -d -T0 --stdout "$work/files/$CANDIDATE_FILE" > "$work/candidate.tar"
          test "$(sha256sum "$work/candidate.tar" | awk '{print $1}')" = "$RAW_ARCHIVE_SHA256"
          rm -f "$work/candidate.tar"
          echo 'ADR0295_FROZEN_CANDIDATE_BYTES_OK'

      - name: Publish exact frozen bytes as GitHub prerelease assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$(cat "$RUNNER_TEMP/adr0295-workdir")"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; verifying without overwrite."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$CANDIDATE_SOURCE_HEAD" \
              --prerelease \
              --title 'ADR 0295 Paperclip Fast Read Frozen Candidate' \
              --notes 'Distribution-only publication of the exact ADR 0295 frozen candidate. This prerelease does not authorize production deployment or activation.' \
              "$work/files/$CANDIDATE_FILE" \
              "$work/files/provenance.json" \
              "$work/files/SHA256SUMS"
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$work/release.json"

          CANDIDATE_PATH="$work/files/$CANDIDATE_FILE" \
          PROVENANCE_PATH="$work/files/provenance.json" \
          SUMS_PATH="$work/files/SHA256SUMS" \
          RELEASE_JSON="$work/release.json" node <<'NODE'
          const fs = require('node:fs');
          const release = JSON.parse(fs.readFileSync(process.env.RELEASE_JSON, 'utf8'));
          const assets = new Map(release.assets.map((a) => [a.name, a]));
          const checks = [
            {
              name: 'paperclip-v2026.916.1-fast-read-candidate.tar.zst',
              path: process.env.CANDIDATE_PATH,
              sha: process.env.CANDIDATE_SHA256,
            },
            {
              name: 'provenance.json',
              path: process.env.PROVENANCE_PATH,
              sha: process.env.PROVENANCE_SHA256,
            },
            {
              name: 'SHA256SUMS',
              path: process.env.SUMS_PATH,
              sha: null,
            },
          ];
          for (const item of checks) {
            const asset = assets.get(item.name);
            if (!asset) throw new Error(`missing release asset: ${item.name}`);
            const size = fs.statSync(item.path).size;
            if (asset.size !== size) throw new Error(`release asset size mismatch: ${item.name}`);
            if (item.sha && asset.digest && asset.digest !== `sha256:${item.sha}`) {
              throw new Error(`release asset digest mismatch: ${item.name}`);
            }
          }
          if (!release.prerelease) throw new Error('release must remain prerelease');
          fs.writeFileSync(
            process.env.RUNNER_TEMP + '/adr0295-candidate-url',
            assets.get('paperclip-v2026.916.1-fast-read-candidate.tar.zst').browser_download_url + '\n',
          );
          NODE

          candidate_url="$(cat "$RUNNER_TEMP/adr0295-candidate-url")"
          env -u GH_TOKEN curl --fail --silent --show-error --location --head "$candidate_url" >/dev/null
          echo 'ADR0295_PUBLIC_RELEASE_DISTRIBUTION_OK'

      - name: Summary
        shell: bash
        run: |
          {
            echo '### ADR 0295 frozen candidate distribution'
            echo
            echo "- Artifact ID: \`$ARTIFACT_ID\`"
            echo "- Actions ZIP SHA-256: \`$ARTIFACT_ZIP_SHA256\`"
            echo "- Candidate SHA-256: \`$CANDIDATE_SHA256\`"
            echo "- Docker config digest: \`$DOCKER_CONFIG_DIGEST\`"
            echo "- Release tag: \`$RELEASE_TAG\`"
            echo '- Production authorization: **NO**'
          } >> "$GITHUB_STEP_SUMMARY"
