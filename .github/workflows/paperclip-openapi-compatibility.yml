name: Paperclip OpenAPI Compatibility

on:
  pull_request:
    paths:
      - 'integrations/paperclip/**'
      - 'infra/stacks/paperclip/compose.yaml'
      - '.github/workflows/paperclip-mastra-adapter-ci.yml'
      - '.github/workflows/organization-adapter-plugin-ci.yml'
      - 'apps/core/src/paperclip-execution/**'
      - 'apps/core/src/organization-adapter/**'
      - 'apps/core/test/paperclip-execution-bridge.test.ts'
      - 'docs/operations/paperclip-customer-work-terminal-disposition-usage-core-adapter-promotion-v2.md'
      - 'docs/research/PAPERCLIP_OPENAPI_COMPATIBILITY_GATE_PROPOSAL_V1.md'
      - '.github/workflows/paperclip-openapi-compatibility.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/paperclip/**'
      - 'infra/stacks/paperclip/compose.yaml'
      - '.github/workflows/paperclip-mastra-adapter-ci.yml'
      - '.github/workflows/organization-adapter-plugin-ci.yml'
      - 'apps/core/src/paperclip-execution/**'
      - 'apps/core/src/organization-adapter/**'
      - 'apps/core/test/paperclip-execution-bridge.test.ts'
      - 'docs/operations/paperclip-customer-work-terminal-disposition-usage-core-adapter-promotion-v2.md'
      - 'docs/research/PAPERCLIP_OPENAPI_COMPATIBILITY_GATE_PROPOSAL_V1.md'
      - '.github/workflows/paperclip-openapi-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paperclip-openapi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Verify dependency inventory, baseline and breaking-change tests offline
        shell: bash
        run: |
          set -euo pipefail
          node --version
          gate_dir=integrations/paperclip/openapi-compatibility-v1
          node "$gate_dir/scripts/baseline.mjs" verify "$gate_dir"
          node "$gate_dir/scripts/check.mjs" \
            "$gate_dir/fixtures/paperclip-v2026.916.0.openapi.json" \
            "$gate_dir/wandora-paperclip-api-contract.json"
          node --test "$gate_dir"/test/*.test.mjs
