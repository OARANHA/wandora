name: Semantic Fast Read CI

on:
  pull_request:
    paths:
      - 'apps/core/src/semantic-routing/**'
      - 'apps/core/src/agent-runtime/**'
      - 'apps/core/src/paperclip-execution/**'
      - 'apps/core/test/fast-read-intent.test.ts'
      - 'integrations/paperclip/adapters/wandora-mastra-v1/**'
      - 'integrations/paperclip/plugins/organization-adapter-v1/**'
      - '.github/workflows/semantic-fast-read-ci.yml'
      - 'docs/decisions/0277-semantic-fast-read-intent-disposable-paperclip-attestation-v1.md'
      - 'docs/CANONICAL_STATE.md'
      - 'docs/WANDORA_PROJECT_SOURCE.md'
  push:
    branches: [main]
    paths:
      - 'apps/core/src/semantic-routing/**'
      - 'apps/core/src/agent-runtime/**'
      - 'apps/core/src/paperclip-execution/**'
      - 'apps/core/test/fast-read-intent.test.ts'
      - 'integrations/paperclip/adapters/wandora-mastra-v1/**'
      - 'integrations/paperclip/plugins/organization-adapter-v1/**'
      - '.github/workflows/semantic-fast-read-ci.yml'
      - 'docs/decisions/0277-semantic-fast-read-intent-disposable-paperclip-attestation-v1.md'
      - 'docs/CANONICAL_STATE.md'
      - 'docs/WANDORA_PROJECT_SOURCE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-fast-read-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout Wandora
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned Paperclip source
        uses: actions/checkout@v4
        with:
          repository: paperclipai/paperclip
          ref: dffc2b3ca1b9e88fa21cb17493083e682dffd1ca
          path: .paperclip
          persist-credentials: false

      - name: Set up Node 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Set up pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm --version

      - name: Install pinned Paperclip dependencies
        working-directory: .paperclip
        run: pnpm install --frozen-lockfile

      - name: Build pinned Paperclip plugin SDK
        working-directory: .paperclip
        run: pnpm --filter @paperclipai/plugin-sdk build

      - name: Install Core dependencies
        working-directory: apps/core
        run: npm ci

      - name: Core typecheck
        working-directory: apps/core
        run: npm run typecheck

      - name: Focused fast-read Core tests
        working-directory: apps/core
        run: node --import tsx --test test/fast-read-intent.test.ts

      - name: Adapter contract tests
        working-directory: integrations/paperclip/adapters/wandora-mastra-v1
        run: node --test test/*.test.mjs

      - name: Organization Adapter package qualification
        working-directory: integrations/paperclip/plugins/organization-adapter-v1
        env:
          WANDORA_SOURCE_SHA: ${{ github.sha }}
        run: bash scripts/verify-package.sh "${{ github.workspace }}/.paperclip"

      - name: Align pinned Paperclip example contract
        shell: bash
        run: |
          sed -i "s/tool_name='kv_get'/tool_name='get_value'/g" integrations/paperclip/adapters/wandora-mastra-v1/verify-fast-read-disposable-e2e.sh
          sed -i "s/:get_value/:get-value/g" integrations/paperclip/adapters/wandora-mastra-v1/disposable-fast-read-core.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path("integrations/paperclip/adapters/wandora-mastra-v1/verify-fast-read-disposable-e2e.sh")
          source = path.read_text()
          old = 'test "$(wait_terminal "$SUCCESS_RUN_ID")" = "succeeded"'
          diagnostic = r'''SUCCESS_RUN_STATUS="$(wait_terminal "$SUCCESS_RUN_ID")"
          if [ "$SUCCESS_RUN_STATUS" != "succeeded" ]; then
            printf 'FAST_READ_SUCCESS_RUN_FAILED run=%s status=%s\n' "$SUCCESS_RUN_ID" "$SUCCESS_RUN_STATUS" >&2
            pc_sql "select status::text,coalesce(error,''),coalesce(error_code,''),coalesce(result_json::text,'') from heartbeat_runs where id='$SUCCESS_RUN_ID'::uuid;" >&2 || true
            pc_sql "select tool_name,status,coalesce(error_code,'') from tool_invocations where company_id='$COMPANY_ID'::uuid order by created_at desc limit 10;" >&2 || true
            printf '%s\n' '--- disposable Core diagnostic ---' >&2
            docker logs "$CORE" >&2 || true
            exit 1
          fi'''
          if old not in source:
              raise SystemExit("fast_read_success_assertion_not_found")
          path.write_text(source.replace(old, diagnostic, 1))
          PY

      - name: Dedicated disposable Semantic Fast Read E2E
        env:
          PAPERCLIP_SOURCE_ROOT: ${{ github.workspace }}/.paperclip
          WANDORA_ATTESTATION_TMP_ROOT: ${{ runner.temp }}/paperclip-wandora-fast-read-e2e
        run: bash integrations/paperclip/adapters/wandora-mastra-v1/verify-fast-read-disposable-e2e.sh
