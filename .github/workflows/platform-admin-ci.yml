name: Platform Admin CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-admin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-admin-verifier:
    runs-on: [self-hosted, linux, x64, wandora-ci]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Verify runtime
        working-directory: apps/platform-admin
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify

      - name: Build private runtime image
        run: docker build -t wandora/platform-admin:ci apps/platform-admin

      - name: Smoke standby contract
        run: |
          container="wandora-platform-admin-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run -d --name "$container" --network none \
            -e PORT=8790 wandora/platform-admin:ci
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if docker exec "$container" node -e \
              "fetch('http://127.0.0.1:8790/healthz').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"; then break; fi
            sleep 1
          done
          docker exec "$container" node -e \
            "fetch('http://127.0.0.1:8790/readyz').then(r=>process.exit(r.status===503?0:1)).catch(()=>process.exit(1))"
          docker exec "$container" node -e \
            "fetch('http://127.0.0.1:8790/internal/v1/platform/session').then(r=>process.exit(r.status===404?0:1)).catch(()=>process.exit(1))"
          test -z "$(docker port "$container")"

      - name: Validate Compose boundaries
        env:
          WANDORA_PLATFORM_OPERATOR_SUBJECTS_FILE: /tmp/platform-operators
        run: |
          base="$(docker compose -f infra/stacks/platform-admin/compose.yaml config)"
          auth="$(docker compose -f infra/stacks/platform-admin/compose.yaml -f infra/stacks/platform-admin/compose.auth.yaml config)"
          ! grep -q '^ *ports:' <<<"$base"
          ! grep -q 'WANDORA_PLATFORM_ADMIN_DB_' <<<"$base"
          ! grep -q 'DATABASE_URL' <<<"$base"
          grep -q 'WANDORA_PLATFORM_ADMIN_AUTH_ENABLED: "false"' <<<"$base"
          grep -q 'internal: true' <<<"$base"
          ! grep -q '^ *ports:' <<<"$auth"
          grep -q 'WANDORA_PLATFORM_ADMIN_AUTH_ENABLED: "true"' <<<"$auth"
          grep -q 'WANDORA_PLATFORM_OPERATOR_SUBJECTS_FILE: /run/secrets/platform_operator_subjects' <<<"$auth"
          grep -q 'source: /tmp/platform-operators' <<<"$auth"
          grep -q 'target: /run/secrets/platform_operator_subjects' <<<"$auth"
          grep -q 'read_only: true' <<<"$auth"
          grep -q 'wandora-platform-auth-egress' <<<"$auth"
          ! grep -q 'wandora-edge' <<<"$auth"
          ! grep -q 'WANDORA_PLATFORM_ADMIN_DB_' <<<"$auth"
          ! grep -q 'DATABASE_URL' <<<"$auth"
