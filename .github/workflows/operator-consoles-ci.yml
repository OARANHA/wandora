name: Operator Consoles CI

on:
  pull_request:
    paths:
      - 'infra/stacks/operator-consoles/**'
      - 'infra/stacks/traefik/dynamic/operator-consoles.yml'
      - 'integrations/mastra/operator-console-v1/**'
      - 'spikes/mastra-agent-runtime-v1/package*.json'
      - '.github/workflows/operator-consoles-ci.yml'
  push:
    branches: [main]
    paths:
      - 'infra/stacks/operator-consoles/**'
      - 'infra/stacks/traefik/dynamic/operator-consoles.yml'
      - 'integrations/mastra/operator-console-v1/**'
      - 'spikes/mastra-agent-runtime-v1/package*.json'
      - '.github/workflows/operator-consoles-ci.yml'

concurrency:
  group: operator-consoles-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, wandora-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Render Compose
        run: docker compose -f infra/stacks/operator-consoles/compose.yaml config >/tmp/operator-consoles.yaml
      - name: Validate Paperclip bridge Nginx config
        run: |
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          install -m 0644 infra/stacks/operator-consoles/control-nginx.conf "$tmp"
          docker run --rm \
            --add-host wandora-paperclip:127.0.0.1 \
            -v "$tmp:/etc/nginx/conf.d/default.conf:ro" \
            nginxinc/nginx-unprivileged:1.29.1-alpine nginx -t
      - name: Build isolated Mastra operator console
        run: docker build -f integrations/mastra/operator-console-v1/Dockerfile -t wandora/mastra-operator-console:ci .
      - name: Smoke read-only Mastra operator console
        run: |
          set -euo pipefail
          container="wandora-runtime-console-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run -d --name "$container" \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /app/.mastra:rw,noexec,nosuid,size=64m \
            -e HOME=/tmp/home \
            -e MASTRA_TELEMETRY_DISABLED=true \
            -e DO_NOT_TRACK=1 \
            wandora/mastra-operator-console:ci
          trap 'docker logs "$container" || true; docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if docker exec "$container" node -e "fetch('http://127.0.0.1:4111/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              docker exec "$container" sh -lc 'used=$(du -sk /app/.mastra | cut -f1); test "$used" -lt 65536'
              exit 0
            fi
            test "$(docker inspect -f '{{.State.Running}}' "$container")" = true
            sleep 2
          done
          exit 1
      - name: Verify no forbidden effect wiring
        run: |
          ! grep -R -E 'WANDORA_ORGANIZATION_ADAPTER_ENABLED|WANDORA_GATEWAY_OUTBOUND|WANDORA_HUMAN_SEND|MISTRAL_API_KEY|CHUTES|EVOLUTION_API' \
            integrations/mastra/operator-console-v1 infra/stacks/operator-consoles
